<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Water Sort">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1a0f45">
<title>Water Sort</title>
<style>
:root{--bg1:#2a1a62;--bg2:#08051a;--ink:#f5f1ff;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.4);--accent:#ffd23f;--btn:rgba(255,255,255,.1);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;position:relative;transition:background .8s}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s var(--ease),opacity .2s,background .2s}
button:active{transform:scale(.94)}button:disabled{opacity:.4}
.bub{position:fixed;bottom:-40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);animation:rise linear infinite;pointer-events:none;z-index:0}
@keyframes rise{to{transform:translateY(-115vh)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:1;transition:opacity .4s ease,transform .5s var(--ease)}
.screen.hidden{opacity:0;transform:scale(.97) translateY(12px);pointer-events:none;visibility:hidden;transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 14px 4px;direction:ltr}
.pill{background:var(--glass);border:1.5px solid var(--edge);border-radius:999px;padding:6px 16px;font-weight:800;font-size:17px;min-width:84px;display:flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(6px)}
.round{width:44px;height:38px;border-radius:999px;border:1.5px solid var(--edge);background:var(--glass);font-size:18px;padding:0}
.lvl{font-size:20px;padding:6px 22px}#info b{color:var(--accent)}
#info{font-size:14px;opacity:.9;height:22px}.warn{color:#ff6b81;font-weight:800}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes breathe{50%{transform:scale(1.03)}}
.hero{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.hero::before{content:"";position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-190px 0 0 -170px;background:radial-gradient(closest-side,rgba(255,210,63,.2),rgba(123,97,255,.18) 55%,transparent);animation:glowp 5s ease-in-out infinite;pointer-events:none}
@keyframes glowp{50%{opacity:.55;transform:scale(1.1)}}
.deco{position:relative;display:flex;gap:18px;align-items:flex-end;direction:ltr}
.mb{--a:#ff4d6d;--b:#2ec4ff;--c:#ffd60a;--h:88px;width:54px;height:132px;border:3px solid rgba(255,255,255,.5);border-top-width:0;border-radius:0 0 30px 30px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.04) 22%,rgba(255,255,255,.02) 72%,rgba(255,255,255,.22));position:relative;animation:bob 4s ease-in-out infinite;box-shadow:inset 0 0 14px rgba(255,255,255,.2),0 18px 22px -10px #000b}
.mb::before{content:"";position:absolute;top:-6px;left:-7px;right:-7px;height:7px;border-radius:5px;background:rgba(255,255,255,.55)}
.mb::after{content:"";position:absolute;left:8px;top:12px;width:5px;height:58%;border-radius:4px;background:rgba(255,255,255,.4);z-index:2}
.mb .lq{position:absolute;left:3px;right:3px;bottom:3px;height:var(--h);border-radius:6px 6px 24px 24px;overflow:hidden;background:linear-gradient(to top,var(--a) 0 33.3%,var(--b) 33.3% 66.6%,var(--c) 66.6%)}
.mb .lq::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.4),transparent 35%,rgba(0,0,0,.2))}
.mb .lq i{position:absolute;top:-6px;left:-12%;width:124%;height:13px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(5px) scaleX(.9)}}
h1{margin:0;font-size:46px;line-height:1.08;font-weight:900;text-align:center;max-width:210px;letter-spacing:.5px;background:linear-gradient(180deg,#fff 20%,#ffd23f 80%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #b27a00) drop-shadow(0 10px 14px #0009)}
.menu{width:100%;max-width:360px;padding:0 20px 14px;display:flex;flex-direction:column;gap:14px}
.big{position:relative;overflow:hidden;height:70px;border:0;border-radius:24px;background:linear-gradient(180deg,#ffe066,#ffb703);color:#2a1a00;font-weight:900;font-size:26px;box-shadow:0 8px 0 #b27a00,0 14px 26px #0007;animation:breathe 2.6s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.big small{display:block;font-size:13px;font-weight:600;opacity:.75}
.big small .i{fill:currentColor;stroke:none;width:13px;height:13px;vertical-align:-2px}
.big:active{box-shadow:0 3px 0 #b27a00;transform:translateY(5px)}
.big::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{min-height:100px;border:1.5px solid rgba(255,255,255,.28);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px #000a;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:start;position:relative}
.card.ready{border-color:rgba(255,210,63,.8);animation:ready 2.4s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 14px #ffd23f30}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 26px #ffd23f70}}
.card.done{opacity:.75}
.card .ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;line-height:1.2}
.card .sub{font-size:14px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:5px;line-height:1.25}.card.done .sub{color:#7be0a4}
.nb.sm{width:32px;height:32px}.nb.sm .i{width:18px;height:18px}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--accent)}
.tabs{width:100%;max-width:460px;display:flex;padding:6px 6px 4px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1.5px solid rgba(255,255,255,.14);border-bottom:0;border-radius:24px 24px 0 0;backdrop-filter:blur(8px)}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:8px 0 6px;color:rgba(255,255,255,.85);position:relative}
.tab .i{width:25px;height:25px}
.dot{position:absolute;top:2px;left:calc(50% + 8px);width:12px;height:12px;border-radius:50%;background:#ff4d6d;border:2px solid #1b0f45;display:none}
main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:6px 12px}
#board{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:42px 16px;max-width:420px;padding-top:26px}
.tube{width:54px;height:190px;border:2.5px solid var(--edge);border-top-width:0;border-radius:0 0 30px 30px;padding:4px;display:flex;flex-direction:column-reverse;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,.09));cursor:pointer;transform:translate(0,0) rotate(0deg);transition:transform .3s var(--spring),border-color .3s,box-shadow .3s;will-change:transform;position:relative;box-shadow:0 10px 18px -8px #0008}
.tube::before{content:"";position:absolute;top:-5px;left:-7px;right:-7px;height:6px;border-radius:5px;background:var(--edge)}
.tube::after{content:"";position:absolute;left:8px;top:14px;width:5px;height:62%;border-radius:4px;background:rgba(255,255,255,.3);pointer-events:none;z-index:2}
.tube.sel{transform:translate(0,-22px) rotate(0deg)}
.tube.hint{animation:glow .6s ease-in-out 3}
.tube.done{border-color:var(--accent);box-shadow:0 0 14px #ffd23f66}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--accent),0 0 22px var(--accent)}}
.seg{height:41px;border-radius:9px;background-image:linear-gradient(90deg,rgba(255,255,255,.3),transparent 38%,rgba(0,0,0,.16));box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff9;font-size:20px;overflow:hidden;flex:none;position:relative}
.seg+.seg{margin-top:2px}.seg:first-child{border-radius:6px 6px 24px 24px}
.tube .seg:last-child::before{content:"";position:absolute;left:5px;right:5px;top:3px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);animation:slosh 2.6s ease-in-out infinite}
@keyframes slosh{50%{transform:translateX(3px) scaleX(.8)}}
.stream{position:fixed;width:7px;border-radius:4px;transform-origin:top;z-index:7;pointer-events:none}
.sk-neon .tube{border-color:#35f0ff;background:rgba(0,0,0,.28);box-shadow:0 0 14px #35f0ff88,inset 0 0 12px #35f0ff33}
.sk-neon .tube::before{background:#35f0ff}.sk-neon .seg{background-image:none;filter:saturate(1.5) brightness(1.1);box-shadow:inset 0 0 8px #fff6}
.sk-candy .tube{border-color:#ffb3d9;border-radius:0 0 22px 22px;background:linear-gradient(90deg,#ffffff30,#ffffff10)}
.sk-candy .tube::before{background:#ffb3d9}.sk-candy .seg{border-radius:14px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 6px,transparent 6px 12px)}
.sk-gold .tube{border-color:#ffd23f;box-shadow:0 0 14px #ffd23f55,0 10px 18px -8px #0008}
.sk-gold .tube::before{background:linear-gradient(90deg,#b8860b,#ffe27a,#b8860b)}
.sk-glass3d .tube{border:3px solid rgba(255,255,255,.55);border-top-width:0;background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 20%,rgba(255,255,255,.02) 72%,rgba(255,255,255,.26));box-shadow:inset 0 0 16px rgba(255,255,255,.28),inset 0 -14px 18px rgba(120,160,255,.18),0 16px 22px -8px #000b}
.sk-glass3d .tube::before{top:-8px;left:-8px;right:-8px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.4),rgba(255,255,255,.06))}
.sk-glass3d .tube::after{left:9px;width:6px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.08));box-shadow:30px 26px 0 -2px rgba(255,255,255,.2)}
.sk-potion .tube{border:3px solid rgba(255,235,200,.6);border-top-width:0;border-radius:0 0 44% 44%/0 0 34% 34%;background:radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.3),rgba(255,255,255,.04) 55%),linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 50%,rgba(255,255,255,.12));box-shadow:inset 0 -12px 18px rgba(255,170,60,.2),0 16px 22px -8px #000b}
.sk-potion .tube::before{top:-22px;left:13px;right:13px;height:22px;border-radius:8px 8px 3px 3px;background:linear-gradient(90deg,#7a4a1f,#c98a4b 40%,#e0a96a 55%,#7a4a1f);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.sk-glass3d .seg,.sk-potion .seg{border-radius:11px/8px;background-image:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 20%,rgba(255,255,255,0) 45%,rgba(0,0,0,.28));box-shadow:inset 0 -9px 12px rgba(0,0,0,.28),inset 0 7px 9px rgba(255,255,255,.3)}
.sk-glass3d .seg:first-child{border-radius:8px 8px 26px 26px}.sk-potion .seg:first-child{border-radius:8px 8px 40% 40%/8px 8px 32% 32%}
.sk-glass3d .tube .seg::before,.sk-potion .tube .seg::before{left:3px;right:3px;top:1px;height:11px;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.65),rgba(255,255,255,0) 72%);animation:none}
.sk-crystal .tube{border:3px solid #c9b8ff;border-top-width:0;border-radius:0 0 12px 12px;background:linear-gradient(115deg,rgba(185,150,255,.38) 0 18%,rgba(255,255,255,.04) 18% 42%,rgba(110,200,255,.28) 42% 66%,rgba(255,255,255,.05) 66% 84%,rgba(185,150,255,.3) 84%);box-shadow:0 0 18px #8b6dff77,inset 0 0 12px #ffffff30,0 14px 20px -8px #000b}
.sk-crystal .tube::before{background:linear-gradient(90deg,#8b6dff,#e6dcff,#6ec8ff);height:7px;top:-6px;border-radius:2px}
.sk-crystal .seg{border-radius:6px;background-image:linear-gradient(135deg,rgba(255,255,255,.5) 0 24%,rgba(255,255,255,0) 24% 52%,rgba(0,0,0,.24) 52%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.sk-crystal .seg:first-child{border-radius:4px 4px 12px 12px}.sk-crystal .tube .seg::before{display:none}
html .tube.done{border-color:var(--accent);box-shadow:0 0 16px #ffd23f88}
nav{display:flex;gap:10px;padding:8px 12px 20px;width:100%;max-width:440px;direction:ltr}
nav button{flex:1;min-width:0;height:76px;border:1.5px solid rgba(255,255,255,.3);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));box-shadow:0 5px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;padding:0 2px}
nav button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
nav button:disabled .nb{filter:grayscale(1)}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px;vertical-align:-3px}.i.big{width:56px;height:56px;stroke-width:1.8}.pill .i{width:20px;height:20px}.round .i{width:20px;height:20px}
.nb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),transparent 45%),var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 4px 8px #0005;color:#fff}
.nb .i{width:21px;height:21px;stroke-width:2.4}
.cost{position:absolute;top:-11px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#1b0f45;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px 1px 5px}.cost .i{width:13px;height:13px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translate(-50%,-8px);background:#000d;padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:90%;text-align:center;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#05020f00;pointer-events:none;transition:background .35s;z-index:20}
.sheet.on{background:#05020fcc;pointer-events:auto}
.panel{width:100%;max-width:460px;max-height:84%;overflow:auto;background:linear-gradient(170deg,#3a2290,#1b0f45);border:1.5px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease)}
.sheet.on .panel{transform:none}
.panel h3{margin:0 0 12px;font-size:22px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:16px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0;direction:ltr}
.langs button{height:40px;border-radius:12px;border:1.5px solid var(--edge);background:var(--btn);font-size:14px}
.langs button.on{background:var(--accent);color:#2a1a00;font-weight:800;border-color:var(--accent)}
.sw{width:54px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.2);position:relative;direction:ltr;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.sw.on{background:#3ddc84}.sw.on::after{transform:translateX(24px)}
.wide{width:100%;margin-top:14px;height:48px;border-radius:16px;border:1.5px solid var(--edge);background:var(--btn)}
.wide.danger{border-color:#ff4d6d;color:#ff8da1}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;direction:ltr}
.lv{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--edge);background:var(--btn);font-weight:800;font-size:18px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv small{font-size:10px;color:var(--accent);height:11px}.lv.cur{background:var(--accent);color:#2a1a00}.lv:disabled{opacity:.3}
.ar{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.ar .tx{flex:1;font-size:15px}.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:7px;overflow:hidden;direction:ltr}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cl{min-width:92px;height:38px;border-radius:12px;border:0;background:var(--accent);color:#2a1a00;font-weight:800;font-size:14px;padding:0 10px}
.cl.off{background:rgba(255,255,255,.15);color:var(--ink);font-weight:500}
.pv{padding:16px 8px 0}.pv .tube{width:30px;height:62px;padding:3px;box-shadow:none;transition:none;pointer-events:none}.pv .tube::after{display:none}.pv .seg{height:16px;font-size:0}.pv .tube .seg:last-child::before{animation:none}
#win{align-items:center;padding:24px}
#card{background:linear-gradient(160deg,#4326a8,#1b0f45);border:1.5px solid var(--edge);border-radius:28px;padding:28px 36px;text-align:center;transform:scale(.7);opacity:0;transition:transform .55s var(--spring),opacity .3s}
#win.on #card{transform:none;opacity:1}
#card h2{margin:0;font-size:26px}#stars{margin:12px 0;direction:ltr;display:flex;gap:8px;justify-content:center;color:var(--accent);min-height:56px}
.st{width:50px;height:50px;color:#fff;opacity:.22}.st .i{width:100%;height:100%;fill:currentColor;stroke:none}.st.on{color:var(--accent);opacity:0;animation:starIn .5s var(--spring) forwards}
@keyframes starIn{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
#card p{margin:0 0 18px;opacity:.85;min-height:1em}
#bNext{border:0;font-weight:800;font-size:18px;background:var(--accent);color:#2a1a00;border-radius:16px;padding:12px 30px}
.cf{position:fixed;top:-20px;width:8px;height:14px;animation:fall 2.4s ease-in forwards;z-index:40;pointer-events:none}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){.bub,.mb,.big,.hero::before{animation:none}}

.panel{position:relative}
.tube .seg:last-child{animation:surf 2.8s ease-in-out infinite}
@keyframes surf{0%,100%{border-top-left-radius:50% 38%;border-top-right-radius:50% 18%}50%{border-top-left-radius:50% 18%;border-top-right-radius:50% 38%}}
.sk-crystal .tube .seg:last-child,.pv .tube .seg:last-child{animation:none}
.seg .gl{width:22px;height:22px;fill:#fff;stroke:none;opacity:.88;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
#boost{display:flex;gap:10px;padding:0 12px 8px;justify-content:center}
.bst{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);font-size:12px;font-weight:600;direction:ltr}
.bst .i{width:18px;height:18px}
.cnt{min-width:22px;height:20px;border-radius:10px;background:var(--accent);color:#2a1a00;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 6px}.cnt .i{width:12px;height:12px}

function star5(x,cx,cy,R){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?R*.45:R;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.fill()}
function shareImage(){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");if(!x)return;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#3a2290");g.addColorStop(1,"#0a0620");x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,430,40,W/2,430,520);rg.addColorStop(0,"rgba(255,210,63,.3)");rg.addColorStop(1,"rgba(255,210,63,0)");x.fillStyle=rg;x.fillRect(0,0,W,H);
  const sets=[["#ff4d6d","#ff9f1c","#ffd60a"],["#3ddc84","#2ec4ff","#7b61ff"],["#f15bb5","#ffd60a","#2ec4ff"]],hs=[330,390,310];
  sets.forEach((cols,k)=>{
    const tw=150,h=hs[k],cx=W/2+(k-1)*200,x0=cx-tw/2,y1=640,y0=y1-h,r=tw/2;
    x.beginPath();x.moveTo(x0,y0);x.lineTo(x0,y1-r);x.arc(cx,y1-r,r,Math.PI,0,true);x.lineTo(x0+tw,y0);x.closePath();
    x.fillStyle="rgba(255,255,255,.12)";x.fill();x.save();x.clip();
    const bh=h*.78/3;cols.forEach((col,i)=>{x.fillStyle=col;x.fillRect(x0,y1-(i+1)*bh,tw,bh)});x.restore();
    x.strokeStyle="rgba(255,255,255,.75)";x.lineWidth=6;x.stroke()});
  x.textAlign="center";x.fillStyle="#fff";x.font="900 96px system-ui,sans-serif";x.fillText(t("title"),W/2,780);
  x.fillStyle="#ffd23f";x.font="700 56px system-ui,sans-serif";x.fillText(mode==="level"?`${t("level")} ${level}`:modeTitle(),W/2,860);
  if(mode!=="zen"){for(let i=0;i<3;i++){x.fillStyle=i<lastStars?"#ffd23f":"rgba(255,255,255,.2)";star5(x,W/2+(i-1)*170,990,70)}}
  x.fillStyle="#fff";x.font="700 64px system-ui,sans-serif";x.fillText(`${moves} ${t("moves")}`,W/2,1130);
  x.fillStyle="rgba(255,255,255,.75)";x.font="600 42px system-ui,sans-serif";x.fillText(t("title_"+title)+(me.name?"  ·  "+me.name:""),W/2,1210);
  c.toBlob(b=>{
    if(!b)return;const f=new File([b],"watersort.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:t("title")}).catch(()=>{})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="watersort.png";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(t("saved"))}
  },"image/png");
}

  for(let i=0;i<f[1];i++){const d=document.createElement("div"),k=f[0];d.className="px "+k;let css=`left:${rr(0,100).toFixed(1)}%;animation-delay:-${rr(0,14).toFixed(1)}s;`;
    if(k==="twinkle")css+=`top:${rr(2,60).toFixed(1)}%;animation-duration:${rr(2,5).toFixed(1)}s`;
    else if(k==="bubble"){const s=rr(8,26);css+=`width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;animation-duration:${rr(9,20).toFixed(1)}s`}
    else if(k==="snow"){const s=rr(2.5,6);css+=`width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;animation-duration:${rr(9,18).toFixed(1)}s`}
    else css+=`animation-duration:${rr(10,18).toFixed(1)}s`;
    d.style.cssText=css;host.appendChild(d)}
}

  const f=NOTE[c%10]*Math.pow(2,(combo-1)/6);tone(f,.38,"triangle",.11);tone(f*1.5,.28,"sine",.05,.08)}

/* daily quests */
const QT={win:[3,30],star3:[2,40],nohint:[2,35],pours:[40,25],tubes:[12,25],zen:[1,20]};
const QK=Object.keys(QT);
function qLoad(){const d=dayNum();if(!qs||qs.d!==d){qs={d,p:{},c:[]};put("ws_q",qs)}}
function qToday(){qLoad();const r=mulberry32(qs.d*31+7),k=QK.slice();for(let i=k.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[k[i],k[j]]=[k[j],k[i]]}return k.slice(0,3)}
function qAdd(k,n=1){qLoad();if(qToday().includes(k)){qs.p[k]=(qs.p[k]||0)+n;put("ws_q",qs)}}
const qReady=i=>{const k=qToday()[i];return!qs.c.includes(i)&&(qs.p[k]||0)>=QT[k][0]};
const anyQuest=()=>{qLoad();return[0,1,2].some(qReady)};

const TITLES=[["rookie",()=>true],["apprentice",()=>stats.wins>=10],["master",()=>stats.wins>=50],["streaker",()=>stats.best>=7],["stargazer",()=>totalStars()>=60],["collector",()=>SKINS.every(x=>owned.includes(x[0]))]];
/* tilt (gyroscope) */
function onOri(e){const g=e.gamma;if(g==null)return;const v=Math.max(-1,Math.min(1,g/30));if(Math.abs(v-lastTilt)<.04)return;lastTilt=v;document.documentElement.style.setProperty("--tilt",v.toFixed(2))}
function tiltSync(){window.removeEventListener("deviceorientation",onOri);if(!tiltOn){document.documentElement.style.setProperty("--tilt",0);return}window.addEventListener("deviceorientation",onOri)}
async function tiltAsk(){
  try{const D=window.DeviceOrientationEvent;if(D&&typeof D.requestPermission==="function"){const r=await D.requestPermission();if(r!=="granted"){tiltOn=false;put("ws_tilt","0");applyClasses();hud();return}}}catch(e){}
  tiltSync();
}

/* friends leaderboard (serverless: share a code, paste a friend's code) */
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
const myCode=()=>"WS1."+b64(JSON.stringify({i:me.id,n:me.name||"Player",s:totalStars(),l:maxLevel,w:weekNum(),m:weekBest(),ti:title}));
function parseCode(c){
  try{c=c.trim();if(!c.startsWith("WS1."))return null;const o=JSON.parse(unb64(c.slice(4)));
    if(typeof o.i!=="string"||typeof o.n!=="string"||!isFinite(o.s)||!isFinite(o.l))return null;
    return{i:o.i.slice(0,12),n:o.n.slice(0,16),s:Math.max(0,Math.min(+o.s,99999)),l:Math.max(1,Math.min(+o.l,99999)),w:isFinite(o.w)?Math.max(0,Math.min(+o.w,99999)):0,m:isFinite(o.m)?Math.max(0,Math.min(+o.m,9999)):0,ti:TITLES.some(x=>x[0]===o.ti)?o.ti:"rookie"}}catch(e){return null}
}
let fTab="s";
function renderFriends(){
  const L=$("fList");L.innerHTML="";
  document.querySelectorAll("[data-ft]").forEach(b=>b.classList.toggle("on",b.dataset.ft===fTab));
  const wn=weekNum();
  let rows=friends.map(f=>({...f,me:false})).concat([{i:me.id,n:me.name||t("you"),s:totalStars(),l:maxLevel,w:wn,m:weekBest(),ti:title,me:true}]);
  if(fTab==="w")rows=rows.filter(r=>r.w===wn&&r.m>0).sort((a,b)=>a.m-b.m);else rows.sort((a,b)=>b.s-a.s||b.l-a.l);
  rows.forEach((r,k)=>{
    const d=document.createElement("div");d.className="fr"+(r.me?" me":"");
    const rk=document.createElement("span");rk.className="rk";rk.textContent=k+1;
    const nm=document.createElement("span");nm.className="nm";nm.textContent=r.n;{const tt=document.createElement("small");tt.textContent=t("title_"+(r.ti||"rookie"));tt.style.cssText="display:block;opacity:.65;font-weight:500;font-size:11px";nm.append(tt)}
    const sc=document.createElement("span");sc.className="sc";
    if(fTab==="w")sc.textContent=`${r.m} ${t("moves")}`;else{sc.innerHTML=ico("star");sc.append(String(r.s))}
    d.append(rk,nm);
    if(fTab!=="w"){const lv=document.createElement("small");lv.style.opacity=".7";lv.textContent=`${t("level")} ${r.l}`;d.append(lv)}
    d.append(sc);
    if(!r.me){const x=document.createElement("button");x.className="cl off";x.style.minWidth="38px";x.textContent="✕";
      x.onclick=()=>{friends=friends.filter(f=>f.i!==r.i);put("ws_friends",friends);renderFriends()};d.append(x)}
    L.appendChild(d)});
  if(!rows.some(r=>!r.me)){const p=document.createElement("p");p.className="note";p.textContent=fTab==="w"?t("noWeek"):t("noFriends");L.appendChild(p)}
}

function copyText(v){
  const ok=()=>toast(t("copied")),
  fb=()=>{try{if(navigator.share){navigator.share({text:v}).catch(()=>{});return}}catch(e){}try{const i=document.createElement("textarea");i.value=v;document.body.appendChild(i);i.select();document.execCommand("copy");i.remove();ok()}catch(e){}};
  try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}
}
